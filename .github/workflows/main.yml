name: build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24

      - name: Read ng-core ref
        id: ng_core
        run: |
          VALUE=$(cat .ng-core-ref 2>/dev/null | grep -v '^#' | tr -d '[:space:]' || echo 'published')
          if [ "$VALUE" = "published" ]; then
            echo "local=false" >> $GITHUB_OUTPUT
          else
            echo "local=true" >> $GITHUB_OUTPUT
            # support owner/repo@ref or plain ref (defaults to rero/ng-core)
            if [[ "$VALUE" == *"@"* ]]; then
              echo "repository=${VALUE%@*}" >> $GITHUB_OUTPUT
              echo "ref=${VALUE#*@}" >> $GITHUB_OUTPUT
            else
              echo "repository=rero/ng-core" >> $GITHUB_OUTPUT
              echo "ref=$VALUE" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Enable Corepack
        run: corepack enable
      - name: install package
        run: pnpm ci

      - name: Checkout ng-core
        if: steps.ng_core.outputs.local == 'true'
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ steps.ng_core.outputs.repository }}
          path: ng-core
          ref: ${{ steps.ng_core.outputs.ref }}

      - name: Build and install local ng-core
        if: steps.ng_core.outputs.local == 'true'
        # Run from the ng-core directory, so Corepack uses the pnpm version of ng-core.
        # Install the pack rather than the dist directory, which would resolve
        # Angular from ng-core/node_modules and load it twice.
        run: |
          (cd ng-core && pnpm ci && pnpm run pack)
          pnpm add ./ng-core/rero-ng-core-*.tgz

      - name: run tests
        run: pnpm exec ./run-tests.sh
        env:
          CI: true
          ALLOW_LOCAL_LINKS: ${{ steps.ng_core.outputs.local == 'true' && '@rero/ng-core' || '' }}
